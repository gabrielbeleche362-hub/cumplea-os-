<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Feliz Cumpleaños</title>
<style>
body {
  margin: 0;
  min-height: 100vh;
  display: flex;
  align-items: center;
  justify-content: center;
  text-align: center;
  font-family: Arial, sans-serif;
  background: linear-gradient(135deg, #ff9a9e, #fad0c4, #fbc2eb);
}
.tarjeta {
  background: white;
  padding: 25px;
  border-radius: 25px;
  width: 80%;
  max-width: 350px;
  box-shadow: 0 5px 20px #0003;
}
h1 { color: #ff4081; }
input, button {
  box-sizing: border-box;
  width: 100%;
  padding: 14px;
  margin-top: 12px;
  border-radius: 12px;
  font-size: 17px;
}
input { border: 2px solid pink; }
button {
  background: #ff4081;
  color: white;
  border: none;
  font-weight: bold;
}
#mensaje {
  color: #e91e63;
  font-size: 24px;
  font-weight: bold;
  margin-top: 20px;
}
</style>
</head>
<body>
<div class="tarjeta">
  <div style="font-size:50px">🎈🎉🎈</div>
  <h1>🎂 ¡Feliz cumpleaños!</h1>
  <p>Escribe tu nombre para recibir una sorpresa. 💖</p>
  <input id="nombre" placeholder="Escribe tu nombre">
  <button onclick="celebrar()">¡Ver mi sorpresa! 🎁</button>
  <div id="mensaje"></div>
  <p id="extra"></p>
</div>
<script>
function celebrar() {
  const nombre = document.getElementById("nombre").value.trim();
  if (!nombre) {
    document.getElementById("mensaje").textContent =
      "¡Escribe tu nombre primero! 😊";
    return;
  }
  document.getElementById("mensaje").textContent =
    "🎉 ¡Feliz cumpleaños, " + nombre + "! 🎂";
  document.getElementById("extra").textContent =
    "🥳🎁 Que tengas un día maravilloso. 💖🎈✨";
}
</script>
</body>
</html>
